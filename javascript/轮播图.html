<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .father {
        width: 500px;
        height: 500px;
        position: relative;
        background-color: pink;
      }
      /* 圆点去除 */
      .father li {
        position: absolute; /* 叠加到同一位置 */
        top: 0;
        left: 0;
        width: 500px; /* 或者 100% */
        height: 500px;
        opacity: 0; /* 默认隐藏，交给 .active 控制 */
        transition: opacity 1s;
        list-style: none;
      }
      .father li:nth-child(1) {
        background-color: red;
      }
      .father li:nth-child(2) {
        background-color: pink;
      }
      .father li:nth-child(3) {
        background-color: blue;
      }
      .father li:nth-child(4) {
        background-color: purple;
      }
      .father li:nth-child(5) {
        background-color: pink;
      }
      .father li.active {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="father">
      <ul>
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>

    <script>
      var ul = document.querySelector("ul");
      var li = ul.children;
      var index = 0;
      setInterval(function () {
        li[index].className = "";
        index++;
        if (index >= li.length) {
          index = 0;
        }
        li[index].className = "active";
      }, 2000);
    </script>
  </body>
</html>
